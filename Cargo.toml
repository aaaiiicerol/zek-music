[package]
name = "zek-music"
version = "0.3.0"
edition = "2021"
description = "Zek Music - player de músicas leve para Linux"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rodio = { version = "=0.19.0", default-features = false, features = ["symphonia-all"] }
notify = "6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.21"
dirs = "5"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
souvlaki = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
