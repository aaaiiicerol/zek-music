name: Gerar AppImage e Windows

# Roda sozinho quando você cria uma tag de versão (ex.: v0.4.0)
# ou manualmente pelo botão "Run workflow" na aba Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ───────────── Linux: AppImage ─────────────
  appimage:
    # Ubuntu 22.04 = glibc mais antigo, então o AppImage roda em mais distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl libfuse2 \
            libasound2-dev libdbus-1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compilar e gerar o AppImage
        run: bash ./build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ZekMusic-x86_64.AppImage

  # ───────────── Windows: instalador + portátil ─────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release

      - name: Ler a versão do Cargo.toml
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          "VERSAO=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Versão: $v"

      - name: Gerar o instalador (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSAO" "packaging\windows\zek-music.iss"

      - name: Gerar a versão portátil
        run: |
          New-Item -ItemType Directory -Path portable\ZekMusic -Force | Out-Null
          Copy-Item target\release\zek-music.exe portable\ZekMusic\
          Copy-Item LICENSE portable\ZekMusic\
          Copy-Item packaging\windows\LEIA-ME-PORTATIL.txt portable\ZekMusic\
          Set-Content -Path portable\ZekMusic\portable.txt -Value "Enquanto este arquivo existir, o Zek Music guarda as configuracoes na pasta 'dados' ao lado do programa."
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path portable\ZekMusic -DestinationPath dist\ZekMusic-Windows-Portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/ZekMusic-Setup.exe
            dist/ZekMusic-Windows-Portable.zip

  # ───────────── Publica tudo junto em Releases ─────────────
  release:
    needs: [appimage, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true

      - name: Conferir os arquivos
        run: ls -la arquivos

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          files: arquivos/*
          body_path: .github/release-body.md
          generate_release_notes: true
